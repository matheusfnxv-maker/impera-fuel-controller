<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛽</text></svg>">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <title>Impera Fuel Controller</title>
</head>
<body>
    <header>
        <h1>Impera Fuell Controler ⛽</h1>
    </header>
    <main>
        <div id="area-semanas"> 
            
            <section class="bloco-semana semana-selecionada" id="semana-1">
                <div class="cabecalho-semana">
                    <span class="titulo-semana" contenteditable="true">Semana 1</span>
                    <div class="acoes-semana">
                        <button class="btn-pdf">PDF</button>
                        <button class="btn-excluir">Excluir</button>
                        <button class="btn-minimizar-semana" aria-label="Minimizar semana">▼</button>
                    </div>
                </div>

                <div class="conteudo-semana">
                    <div class="bloco-dia">
                        <div class="cabecalho-data">
                            <input type="date" class="input-data">
                            <h2 class="titulo-data"></h2>
                            <button class="btn-excluir-dia">X</button>
                        </div>

                        <table>
                            <thead>
                                <tr>
                                    <th>finalidade</th>
                                    <th>local</th>
                                    <th>km ida</th>
                                    <th>km volta</th>
                                    <th>total</th>
                                    <th>anotacoes</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><input name="finalidade" type="text"></td>
                                    <td><input name="local" type="text"></td>
                                    <td><input name="km-ida" type="number"></td>
                                    <td><input name="km-volta" type="number"></td>
                                    <td class="total-km">0</td>
                                    <td><input name="anotacoes" type="text"></td>
                                    <td><button class="btn-excluir-linha">X</button></td>
                                </tr>
                            </tbody>
                        </table>
                        
                        <div class="acoes-dia">
                            <button class="btn-nova-linha">+ nova viagem</button>
                        </div>


                    </div>

                    <button class="btn-proximo-dia">+ novo dia</button>
                </div>
            </section>


        </div>
        <div id="Sidebar">
            <section id="DadosUsuario">
        <div>
            <label for="nome-usuario">Nome</label>
            <input id="nome-usuario" type="text" placeholder="Seu nome">
        </div>
        <div>
    <label for="funcao-usuario">Função na empresa</label>
    <select id="funcao-usuario">
        <option value="" disabled selected>Selecione</option>
        <option value="Corretor Vendas">Corretor Vendas</option>
        <option value="Corretor Locação">Corretor Locação</option>
        <option value="Vistoriador">Vistoriador</option>
        <option value="Administrativo">Administrativo</option>
        <option value="Marketing">Marketing</option>
        <option value="Outros">Outros</option>
    </select>
    </div>
        </section>

            <section id="ResumoSemana">
        <div id="titulo-resumo">Semana 1</div>
        <table>
            <thead>
                <tr>
                    <th>dia</th>
                    <th>km</th>
                    <th>valor</th>
                </tr>
            </thead>
            <tbody id="corpo-resumo">
                <tr><th scope="row">seg</th><td class="resumo-km">0 km</td><td class="resumo-valor">R$0,00</td></tr>
                <tr><th scope="row">ter</th><td class="resumo-km">0 km</td><td class="resumo-valor">R$0,00</td></tr>
                <tr><th scope="row">qua</th><td class="resumo-km">0 km</td><td class="resumo-valor">R$0,00</td></tr>
                <tr><th scope="row">qui</th><td class="resumo-km">0 km</td><td class="resumo-valor">R$0,00</td></tr>
                <tr><th scope="row">sex</th><td class="resumo-km">0 km</td><td class="resumo-valor">R$0,00</td></tr>
                <tr><th scope="row">sab</th><td class="resumo-km">0 km</td><td class="resumo-valor">R$0,00</td></tr>
                <tr><th scope="row">dom</th><td class="resumo-km">0 km</td><td class="resumo-valor">R$0,00</td></tr>
                <tr id="linha-total">
                    <th scope="row">total</th>
                    <td id="total-km-semana">0 km</td>
                    <td id="total-valor-semana">R$0,00</td>
                </tr>
            </tbody>
        </table>
    </section>

    <section id="Configuracao">
        <div>
            <label for="preco-gasolina">Preço Gasolina</label>
            <input id="preco-gasolina" type="number" step="0.01">
        </div>
        <div>
            <label for="km-por-litro">km por litro</label>
            <input id="km-por-litro" type="number" step="0.1">
        </div>
    </section>

    <button id="btn-nova-semana">+ nova semana</button>

        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
